name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Build
        run: npm run build

      - name: Unit and component tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

      # The Playwright suites (frame gate, barrier assertions, page-level rules, exit
      # link) land with the slices that give them something to test — SPEC_v1.md slice 0.
