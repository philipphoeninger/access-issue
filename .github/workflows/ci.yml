name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      # CLAUDE.md rule 5. Static, so it runs before the build: a simulation
      # styled in WERTE.IT's tokens renders fine and passes every axe run — the
      # boundary it breaks is invisible to everything else in this pipeline.
      - name: Token boundary (CLAUDE.md rule 5, docs/TESTING.md §8.1)
        run: npm run check:tokens

      - name: Build
        run: npm run build

      - name: Unit and component tests
        # --code-coverage generates coverage/access-issue/lcov.info.
        # The content-release-gate spec stays pending here on purpose — it is
        # a release gate, not a merge gate (docs/SPEC_v1.md §4.1).
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Branch-coverage gate (docs/TESTING.md §14)
        # Not karma-coverage's own coverageReporter.check — see the comment
        # on that option in karma.conf.js for why it cannot work here.
        run: node scripts/check-coverage.js

  # The Playwright suite, sharded by scenario (docs/TESTING.md §4, §15). Four
  # jobs in parallel, and beside `build-and-test` rather than behind it: the
  # pull-request budget is wall-clock time, and every one of these blocks the
  # merge either way.
  #
  # Sharding is the first of the two mitigations docs/TESTING.md §4 names for a
  # suite that has outgrown the budget, and the only one that costs no
  # coverage. The state matrix itself does not shrink — the shard membership
  # lives in playwright.config.ts, which refuses to load if a spec file belongs
  # to no shard.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      # One shard's failure must not cancel the others: „the campaign is red"
      # and „everything is red" are different diagnoses, and a cancelled job
      # cannot tell them apart.
      fail-fast: false
      matrix:
        shard: [application, campaign, frame, exit-link]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright (${{ matrix.shard }})
        run: npx playwright test --project=chromium
        env:
          E2E_SHARD: ${{ matrix.shard }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  # Release gate, not a merge gate (docs/SPEC_v1.md §4.1). Runs only on a
  # version tag push, so ordinary PRs and main-branch pushes are unaffected.
  # Fails loudly if any barrier's editorial prose is still WERTE.IT
  # scaffolding (`contentStatus: 'placeholder'`) — see
  # src/app/content/content-release-gate.spec.ts.
  content-release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Content release gate
        run: npm run test:release-gate
