<!-- Beitragsbild 2 der nachgebildeten Social-Media-Einbettung
     (docs/UX-COPY.md §9.3 `csr.social.post2.alt`, docs/SPEC_v2.md Slice 16).

     Schematisch, mit denselben Zahlenwerten statt Tokens wie
     csr-post-anstrich.svg — die Begründung steht dort.

     **Der Betrag steht im Bild.** Ein symbolischer Spendenscheck trägt seine
     Summe, sonst ist er keiner. Dass die Zahl damit nur im Bild steht, ist
     genau die Barriere `alt` und keine zweite, undeklarierte: Der
     Alternativtext nennt sie, sobald die Barriere behoben ist. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 600"
  width="600"
  height="600"
>
  <defs>
    <g id="figure">
      <rect x="-17" y="-34" width="14" height="34" rx="6" fill="#33475b" />
      <rect x="3" y="-34" width="14" height="34" rx="6" fill="#33475b" />
      <rect x="-23" y="-102" width="46" height="72" rx="16" fill="#1f3a5f" />
      <circle cx="0" cy="-120" r="17" fill="#33475b" />
    </g>
    <g id="figure-alt">
      <rect x="-17" y="-34" width="14" height="34" rx="6" fill="#5a6b7b" />
      <rect x="3" y="-34" width="14" height="34" rx="6" fill="#5a6b7b" />
      <rect x="-23" y="-102" width="46" height="72" rx="16" fill="#5a6b7b" />
      <circle cx="0" cy="-120" r="17" fill="#33475b" />
    </g>
  </defs>

  <!-- Raum: Wand, Fensterband, Boden -->
  <rect x="0" y="0" width="600" height="600" fill="#f5f6f7" />
  <rect x="60" y="60" width="480" height="150" rx="6" fill="#c9d3dc" />
  <path d="M300 60 L300 210" stroke="#f5f6f7" stroke-width="8" />
  <rect x="0" y="470" width="600" height="130" fill="#d8dde2" />
  <path d="M0 470 L600 470" stroke="#a8b6c4" stroke-width="3" />

  <!-- Übergebende links, zwei Vertreterinnen des Treffs rechts -->
  <use href="#figure-alt" transform="translate(112 512)" />
  <use href="#figure" transform="translate(430 512)" />
  <use href="#figure" transform="translate(516 500) scale(0.94)" />

  <!-- Arme zum Scheck -->
  <path
    d="M130 420 L214 396"
    stroke="#5a6b7b"
    stroke-width="12"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M412 420 L392 396"
    stroke="#1f3a5f"
    stroke-width="12"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Der symbolische Scheck -->
  <rect x="196" y="292" width="216" height="118" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="4" />
  <rect x="216" y="312" width="88" height="9" rx="4" fill="#d8dde2" />
  <text
    x="304"
    y="382"
    font-family="Arial, Helvetica, sans-serif"
    font-size="44"
    font-weight="bold"
    fill="#1f3a5f"
    text-anchor="middle"
  >
    2.000 €
  </text>
</svg>
