<!--
  Elbwerk AG — Wort-Bild-Marke der fiktiven Firma (docs/UX-COPY.md §8.1).

  Simulationsasset, kein Rahmen-Asset: Die Farben spiegeln die Token sim-brand
  (#1F3A5F) und sim-muted (#5A6B7B) aus src/styles/_tokens.scss — hier ohne die
  führenden Doppelbindestriche, die ein XML-Kommentar nicht enthalten darf. Sie stehen als
  Literale, weil eine über <img> eingebundene SVG-Datei keine CSS-Variablen des
  einbindenden Dokuments sieht — wird eines der beiden Token geändert, gehört
  diese Datei mit angepasst.

  Selbst gehostet wie alle Assets (docs/ARCHITECTURE.md §16, keine Requests an
  Dritte). Der Alternativtext steht im Template (`elbwerk.logo.alt`), nicht hier.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 216 48"
  width="216"
  height="48"
>
  <!-- Signet: Elbe-Wellen im Quadrat — „Elb" + „werk". -->
  <rect x="0" y="2" width="44" height="44" rx="6" fill="#1F3A5F" />
  <path
    d="M9 20 q6.5 -7 13 0 t13 0"
    fill="none"
    stroke="#8FADCB"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    d="M9 30 q6.5 -7 13 0 t13 0"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Wortmarke. Systemschrift wie die ganze Simulation (docs/DESIGN.md §4.2). -->
  <text
    x="56"
    y="27"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21"
    font-weight="700"
    letter-spacing="1.6"
    fill="#1F3A5F"
  >ELBWERK</text>
  <text
    x="57"
    y="40"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    font-weight="400"
    letter-spacing="2.4"
    fill="#5A6B7B"
  >AG · HAMBURG</text>
</svg>
