      <circle cx="0" cy="-104" r="15" fill="#33475b" />
    </g>
    <g id="child-alt">
      <rect x="-20" y="-88" width="40" height="62" rx="14" fill="#5a6b7b" />
      <circle cx="0" cy="-104" r="15" fill="#33475b" />
    </g>
  </defs>

  <!-- Raum: Wand mit Pinnwand, Boden -->
  <rect x="0" y="0" width="600" height="600" fill="#f5f6f7" />
  <rect x="86" y="52" width="428" height="132" rx="6" fill="#c9d3dc" stroke="#a8b6c4" stroke-width="3" />
