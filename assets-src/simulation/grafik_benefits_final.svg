<!--
  Quelle der Textgrafik aus docs/UX-COPY.md §8.6 — der Barriere `grafik` in
  Schritt 1 des Bewerbungsprozesses.

  ACHTUNG: Diese Datei wird NICHT ausgeliefert. Ausgeliefert wird die daraus
  gerenderte Rastergrafik public/simulation/grafik_benefits_final.png. Ein SVG
  bliebe beim Vergrößern scharf und nähme der Barriere damit die Hälfte ihrer
  Wirkung — verpixelnde Buchstaben bei 400 % Zoom sind der Teil, den sehende
  Teilnehmende am eigenen Bildschirm nachvollziehen (docs/UX-COPY.md §8.6).

  Neu rendern nach jeder Textänderung, aus dem Projektwurzelverzeichnis:

    rsvg-convert -w 640 -h 460 \
      assets-src/simulation/grafik_benefits_final.svg \
      -o public/simulation/grafik_benefits_final.png

  Die Texte hier sind Kopien der Schlüssel `elbwerk.job.benefits.h3`,
  `elbwerk.job.benefits.items`, `elbwerk.job.salary`, `elbwerk.job.process.h3`
  und `elbwerk.job.process.items`. Sie müssen mit der behobenen Textfassung im
  Template übereinstimmen — beide Zustände tragen denselben Sachinhalt, das ist
  die Bedingung dafür, dass das Szenario Barrierefreiheit misst und nicht
  Informationsmenge (docs/UX-COPY.md §1). job-posting-step.component.spec.ts
  prüft das für die Textfassung; für die Grafik ist es Handarbeit.

  Die Grafik trägt Leistungen, Vergütung UND Ablauf — alle drei Angaben, die
  docs/PRD.md §6.1 für diese Barriere nennt. Der Ablauf ist dabei der Teil, nach
  dem jemand handelt; ihn wegzulassen würde die Barriere harmloser aussehen
  lassen, als sie ist.

  Farben (Token-Namen ohne führende Doppelbindestriche, die ein XML-Kommentar
  nicht enthalten darf): sim-brand #1F3A5F, sim-text #33475B, sim-muted
  #5A6B7B, sim-surface #F5F6F7, sim-border #D8DDE2 (src/styles/_tokens.scss).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 460"
  width="640"
  height="460"
  font-family="Arial, Helvetica, sans-serif"
>
  <rect width="640" height="460" fill="#FFFFFF" />
  <rect x="0.5" y="0.5" width="639" height="459" fill="#F5F6F7" stroke="#D8DDE2" />

