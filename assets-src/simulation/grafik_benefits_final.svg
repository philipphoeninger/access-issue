    <text x="70" y="145" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">30</text>
    <text x="94" y="145" font-size="15" fill="#33475B">Urlaubstage</text>
  </g>
  <g>
    <rect x="230" y="110" width="180" height="60" rx="4" fill="#FFFFFF" stroke="#D8DDE2" />
    <circle cx="260" cy="140" r="13" fill="#1F3A5F" />
    <path d="M260 133 v7 h5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="284" y="145" font-size="15" fill="#33475B">Gleitzeit</text>
  </g>
  <g>
    <rect x="420" y="110" width="180" height="60" rx="4" fill="#FFFFFF" stroke="#D8DDE2" />
    <circle cx="450" cy="140" r="13" fill="#1F3A5F" />
    <circle cx="446" cy="143" r="3.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" />
    <circle cx="455" cy="143" r="3.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" />
    <text x="474" y="145" font-size="15" fill="#33475B">Jobrad</text>
  </g>
  <g>
    <rect x="40" y="182" width="275" height="60" rx="4" fill="#FFFFFF" stroke="#D8DDE2" />
    <circle cx="70" cy="212" r="13" fill="#1F3A5F" />
    <rect x="64" y="206" width="12" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.6" />
    <text x="94" y="207" font-size="15" fill="#33475B">Zuschuss zum</text>
    <text x="94" y="225" font-size="15" fill="#33475B">Deutschlandticket</text>
  </g>
  <g>
    <rect x="325" y="182" width="275" height="60" rx="4" fill="#FFFFFF" stroke="#D8DDE2" />
    <circle cx="355" cy="212" r="13" fill="#1F3A5F" />
    <path d="M349 216 l4 -6 l4 4 l5 -8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="379" y="207" font-size="15" fill="#33475B">Betriebliche</text>
    <text x="379" y="225" font-size="15" fill="#33475B">Altersvorsorge</text>
  </g>

  <!-- Vergütung: die Angabe, deren Verlust am unmittelbarsten einleuchtet. -->
  <rect x="40" y="262" width="560" height="62" rx="4" fill="#1F3A5F" />
  <text x="60" y="288" font-size="14" letter-spacing="1.2" fill="#8FADCB">VERGÜTUNG</text>
  <text x="60" y="310" font-size="17" font-weight="700" fill="#FFFFFF">
    Haustarif, Entgeltgruppe 11 (58.000 – 68.000 € brutto/Jahr)
  </text>

  <!-- Ablauf der Bewerbung: die handlungsleitende Angabe (docs/PRD.md §6.1). -->
