  <g>
    <circle cx="52" cy="392" r="12" fill="#1F3A5F" />
    <text x="52" y="397" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="72" y="397" font-size="14" fill="#33475B">Online bewerben</text>

    <circle cx="212" cy="392" r="12" fill="#1F3A5F" />
