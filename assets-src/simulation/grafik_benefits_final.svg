    <text x="232" y="390" font-size="14" fill="#33475B">Rückmeldung in</text>
    <text x="232" y="406" font-size="14" fill="#33475B">zwei Wochen</text>

    <circle cx="392" cy="392" r="12" fill="#1F3A5F" />
    <text x="392" y="397" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="412" y="390" font-size="14" fill="#33475B">Gespräch per Video</text>
    <text x="412" y="406" font-size="14" fill="#33475B">oder vor Ort</text>

    <circle cx="52" cy="430" r="12" fill="#1F3A5F" />
    <text x="52" y="435" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="72" y="435" font-size="14" fill="#33475B">Start nach Absprache</text>
  </g>

  <text x="392" y="437" font-size="12" fill="#5A6B7B">Stand 2026 · Änderungen vorbehalten</text>
</svg>
