<app-skip-links [hasPanel]="hasPanel()" />

<header>
  <mat-toolbar class="site-header">
    <div class="brand">
      <p class="project-name">WERTE.IT</p>
      <p class="tool-name">AccessIssue</p>
      <p class="tagline">Barrieren sehen, verstehen, beheben</p>
    </div>

    <nav class="scenario-nav" aria-label="Szenarien">
      <a mat-button routerLink="/">Startseite</a>
      @for (scenario of availableScenarios(); track scenario.id) {
        <a mat-button [routerLink]="scenarioLink(scenario)">{{ scenario.title }}</a>
      }
    </nav>
  </mat-toolbar>
</header>

<!-- tabindex="-1" for the same reason as the panel column in
     ScenarioPageComponent: without it a fragment link only sets the
     sequential-navigation starting point, and screen readers whose reading
     cursor follows focus stay where they were — a skip link that changes the
     URL and nothing else. -->
<main id="content" tabindex="-1">
  <router-outlet />
</main>

<div appVisuallyHidden aria-live="polite" aria-atomic="true">{{ announcer.message() }}</div>
