<h1>{{ scenario().title }}</h1>

<!-- Both only where there is more than one step: "Schritt 1 von 1 — …" would
     be counting for its own sake, and the h1 plus the region heading already
     name a single-step scenario (docs/UX-COPY.md §5.3). -->
@if (hasMultipleSteps()) {
  <p class="step-indicator">{{ stepIndicator() }}</p>

  <!-- `queryParamsHandling="preserve"` because barrier state is scoped to the
       *scenario*, not to the step: `frei` lists barriers from all four steps
       (docs/ARCHITECTURE.md §8), the panel shows all of them grouped by step
       (§12.1.1), and the counter counts all of them. Without this, walking to
       the next step silently reset every barrier the user had resolved — and
       a link shared from step 2 lost the state it was shared for. No
       `replaceUrl`: step navigation is the one thing that pushes (§10), so
       Back returns to the previous step with its state intact. -->
  <nav class="step-nav" aria-label="Schritte in diesem Szenario">
    @if (previousStep(); as prev) {
      <a mat-button [routerLink]="stepLink(prev)" queryParamsHandling="preserve"
        >Zurück zu: {{ prev.title }}</a
      >
    }
    @if (nextStep(); as next) {
      <a mat-button [routerLink]="stepLink(next)" queryParamsHandling="preserve"
        >Weiter zu: {{ next.title }}</a
      >
    }
  </nav>
}

<div class="scenario-layout">
  <!-- tabindex="-1" so the two links that target `#panel` — the header skip
       link and the simulation region's exit link — actually move focus here.
       Without it the browser only sets a sequential-navigation starting point
       and `document.activeElement` stays on <body>, which is precisely the
       half-working exit docs/TESTING.md §7 exists to catch. -->
  <div class="panel-column" id="panel" tabindex="-1">
    <app-barrier-panel [scenario]="scenario()" />
  </div>
  <div class="simulation-column">
    <!-- `simulatedPath` stays unset until the step components exist: the
         Elbwerk address is simulation content (docs/UX-COPY.md §8), and the
         frame does not invent it. Scenario content is projected into the
         region from slice 7 on; until then the region is deliberately
         rendered and empty (docs/SPEC_v1.md slice 4 acceptance). -->
    <app-simulation-region [scenario]="scenario()" />
  </div>
</div>
